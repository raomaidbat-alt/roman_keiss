<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="arcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>
  <circle cx="50" cy="50" r="38" fill="#0b0e14" stroke="#00f5ff" stroke-width="3" filter="url(#arcGlow)"/>
  
  <!-- Reactor Segments (10 segments) -->
  <g stroke="#00f5ff" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="16" x2="50" y2="24"/>
    <line x1="70" y1="22" x2="65" y2="29"/>
    <line x1="82" y1="40" x2="74" y2="43"/>
    <line x1="80" y1="62" x2="72" y2="59"/>
    <line x1="65" y1="78" x2="60" y2="71"/>
    <line x1="50" y1="84" x2="50" y2="76"/>
    <line x1="35" y1="78" x2="40" y2="71"/>
    <line x1="20" y1="62" x2="28" y2="59"/>
    <line x1="18" y1="40" x2="26" y2="43"/>
    <line x1="30" y1="22" x2="35" y2="29"/>
  </g>
  
  <!-- Inner Ring & Core -->
  <circle cx="50" cy="50" r="22" fill="#001824" stroke="#00f5ff" stroke-width="2"/>
  <circle cx="50" cy="50" r="14" fill="#00f5ff" opacity="0.8" filter="url(#arcGlow)"/>
  <circle cx="50" cy="50" r="7" fill="#ffffff"/>
</svg>
