<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%" style="background:#fff0f6; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-card" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#ffffff" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#fbcfe8" stroke-width="1" />
  
  <text x="40" y="42" font-size="22" font-weight="800" fill="#be185d">❤️ Товары</text>
  <text x="40" y="58" font-size="11" font-weight="500" fill="#db2777">Рейтинг, ABC, тренды &amp; Управление запасами</text>

  <!-- Filters & Search Bar -->
  <g transform="translate(40, 85)">
    <!-- Time Tabs -->
    <rect x="0" y="0" width="65" height="34" rx="17" fill="#ffffff" stroke="#fbcfe8"/>
    <text x="32" y="22" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">7 дней</text>

    <rect x="75" y="0" width="75" height="34" rx="17" fill="#e11d48"/>
    <text x="112" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">30 дней</text>

    <rect x="160" y="0" width="75" height="34" rx="17" fill="#ffffff" stroke="#fbcfe8"/>
    <text x="197" y="22" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">90 дней</text>

    <rect x="245" y="0" width="95" height="34" rx="17" fill="#ffffff" stroke="#fbcfe8"/>
    <text x="292" y="22" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Весь период</text>

    <!-- Metal Category Filters -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="55" height="34" rx="17" fill="#e11d48"/>
      <text x="27" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Все</text>

      <rect x="65" y="0" width="75" height="34" rx="17" fill="#ffffff" stroke="#fbcfe8"/>
      <text x="102" y="22" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Золото</text>

      <rect x="150" y="0" width="80" height="34" rx="17" fill="#ffffff" stroke="#fbcfe8"/>
      <text x="190" y="22" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Серебро</text>

      <rect x="240" y="0" width="75" height="34" rx="17" fill="#ffffff" stroke="#fbcfe8"/>
      <text x="277" y="22" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Прочее</text>
    </g>

    <!-- Search Input -->
    <rect x="690" y="0" width="430" height="34" rx="17" fill="#ffffff" stroke="#fbcfe8"/>
    <text x="710" y="22" font-size="11" font-weight="500" fill="#94a3b8">Поиск по названию или SKU (напр. «молитва», «мятый лист»)...</text>
  </g>

  <!-- 4 Columns Grid (Лидеры, Растет спрос, Падает спрос, Без продаж) -->
  <!-- Col 1: Лидеры -->
  <g transform="translate(40, 135)">
    <rect x="0" y="0" width="265" height="420" rx="16" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    
    <!-- Col Header -->
    <rect x="15" y="15" width="235" height="40" rx="10" fill="#e11d48" />
    <text x="28" y="39" font-size="12" font-weight="800" fill="#ffffff">👑 Лидеры</text>
    <text x="20" y="72" font-size="10" font-weight="600" fill="#db2777">самая большая выручка</text>

    <!-- Product 1 -->
    <rect x="15" y="85" width="235" height="58" rx="10" fill="#fff1f2" stroke="#ffe4e6" />
    <text x="25" y="105" font-size="11" font-weight="700" fill="#0f172a">колье «молитва» круг с брилли...</text>
    <text x="25" y="125" font-size="12" font-weight="800" fill="#e11d48">88 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 2 -->
    <rect x="15" y="150" width="235" height="58" rx="10" fill="#fff1f2" stroke="#ffe4e6" />
    <text x="25" y="170" font-size="11" font-weight="700" fill="#0f172a">чокер из аквамарина с брилли...</text>
    <text x="25" y="190" font-size="12" font-weight="800" fill="#e11d48">55 930 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 3 -->
    <rect x="15" y="215" width="235" height="58" rx="10" fill="#fff1f2" stroke="#ffe4e6" />
    <text x="25" y="235" font-size="11" font-weight="700" fill="#0f172a">серьги (пара) «мятый лист» из...</text>
    <text x="25" y="255" font-size="12" font-weight="800" fill="#e11d48">53 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 4 -->
    <rect x="15" y="280" width="235" height="58" rx="10" fill="#fff1f2" stroke="#ffe4e6" />
    <text x="25" y="300" font-size="11" font-weight="700" fill="#0f172a">серьги (пара) «мятый лист» из...</text>
    <text x="25" y="320" font-size="12" font-weight="800" fill="#e11d48">53 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 5 -->
    <rect x="15" y="345" width="235" height="58" rx="10" fill="#fff1f2" stroke="#ffe4e6" />
    <text x="25" y="365" font-size="11" font-weight="700" fill="#0f172a">колье с серафинитом из желто...</text>
    <text x="25" y="385" font-size="12" font-weight="800" fill="#e11d48">44 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>
  </g>

  <!-- Col 2: Растёт спрос -->
  <g transform="translate(325, 135)">
    <rect x="0" y="0" width="265" height="420" rx="16" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    
    <!-- Col Header -->
    <rect x="15" y="15" width="235" height="40" rx="10" fill="#059669" />
    <text x="28" y="39" font-size="12" font-weight="800" fill="#ffffff">⚡ Растёт спрос</text>
    <text x="20" y="72" font-size="10" font-weight="600" fill="#059669">+15% и выше к прошлому периоду</text>

    <!-- Product 1 -->
    <rect x="15" y="85" width="235" height="58" rx="10" fill="#f0fdf4" stroke="#dcfce7" />
    <text x="25" y="105" font-size="11" font-weight="700" fill="#0f172a">колье «молитва» круг с брилли...</text>
    <text x="25" y="125" font-size="12" font-weight="800" fill="#059669">88 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 2 -->
    <rect x="15" y="150" width="235" height="58" rx="10" fill="#f0fdf4" stroke="#dcfce7" />
    <text x="25" y="170" font-size="11" font-weight="700" fill="#0f172a">чокер из аквамарина с брилли...</text>
    <text x="25" y="190" font-size="12" font-weight="800" fill="#059669">55 930 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 3 -->
    <rect x="15" y="215" width="235" height="58" rx="10" fill="#f0fdf4" stroke="#dcfce7" />
    <text x="25" y="235" font-size="11" font-weight="700" fill="#0f172a">серьги (пара) «мятый лист» из...</text>
    <text x="25" y="255" font-size="12" font-weight="800" fill="#059669">53 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 4 -->
    <rect x="15" y="280" width="235" height="58" rx="10" fill="#f0fdf4" stroke="#dcfce7" />
    <text x="25" y="300" font-size="11" font-weight="700" fill="#0f172a">серьги (пара) «мятый лист» из...</text>
    <text x="25" y="320" font-size="12" font-weight="800" fill="#059669">53 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>

    <!-- Product 5 -->
    <rect x="15" y="345" width="235" height="58" rx="10" fill="#f0fdf4" stroke="#dcfce7" />
    <text x="25" y="365" font-size="11" font-weight="700" fill="#0f172a">колье с серафинитом из желто...</text>
    <text x="25" y="385" font-size="12" font-weight="800" fill="#059669">44 000 ₽ <tspan font-size="10" font-weight="600" fill="#94a3b8">• 1 шт.</tspan></text>
  </g>

  <!-- Col 3: Падает спрос -->
  <g transform="translate(610, 135)">
    <rect x="0" y="0" width="265" height="420" rx="16" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    
    <!-- Col Header -->
    <rect x="15" y="15" width="235" height="40" rx="10" fill="#f43f5e" />
    <text x="28" y="39" font-size="12" font-weight="800" fill="#ffffff">↘ Падает спрос</text>
    <text x="20" y="72" font-size="10" font-weight="600" fill="#e11d48">-15% и ниже к прошлому периоду</text>

    <text x="132" y="230" font-size="13" font-weight="500" fill="#db2777" text-anchor="middle">Пусто.</text>
    <text x="132" y="250" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Нет резких спадов</text>
  </g>

  <!-- Col 4: Без продаж -->
  <g transform="translate(895, 135)">
    <rect x="0" y="0" width="265" height="420" rx="16" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    
    <!-- Col Header -->
    <rect x="15" y="15" width="235" height="40" rx="10" fill="#475569" />
    <text x="28" y="39" font-size="12" font-weight="800" fill="#ffffff">❄️ Без продаж</text>
    <text x="20" y="72" font-size="10" font-weight="600" fill="#64748b">есть остаток, но 0 продаж</text>

    <!-- Product 1 -->
    <rect x="15" y="85" width="235" height="58" rx="10" fill="#f8fafc" stroke="#f1f5f9" />
    <text x="25" y="105" font-size="11" font-weight="700" fill="#0f172a">Silver Cleaning Cloth</text>
    <text x="25" y="125" font-size="11" font-weight="600" fill="#e11d48">Остаток 80</text>

    <!-- Product 2 -->
    <rect x="15" y="150" width="235" height="58" rx="10" fill="#f8fafc" stroke="#f1f5f9" />
    <text x="25" y="170" font-size="11" font-weight="700" fill="#0f172a">Velvet Jewelry Box</text>
    <text x="25" y="190" font-size="11" font-weight="600" fill="#e11d48">Остаток 50</text>

    <!-- Product 3 -->
    <rect x="15" y="215" width="235" height="58" rx="10" fill="#f8fafc" stroke="#f1f5f9" />
    <text x="25" y="235" font-size="11" font-weight="700" fill="#0f172a">Silver Stacking Ring</text>
    <text x="25" y="255" font-size="11" font-weight="600" fill="#e11d48">Остаток 22</text>

    <!-- Product 4 -->
    <rect x="15" y="280" width="235" height="58" rx="10" fill="#f8fafc" stroke="#f1f5f9" />
    <text x="25" y="300" font-size="11" font-weight="700" fill="#0f172a">Silver Huggie Hoops</text>
    <text x="25" y="320" font-size="11" font-weight="600" fill="#e11d48">Остаток 18</text>

    <!-- Product 5 -->
    <rect x="15" y="345" width="235" height="58" rx="10" fill="#f8fafc" stroke="#f1f5f9" />
    <text x="25" y="365" font-size="11" font-weight="700" fill="#0f172a">Gold Pendant Heart</text>
    <text x="25" y="385" font-size="11" font-weight="600" fill="#e11d48">Остаток 15</text>
  </g>

  <!-- Bottom Section: Риск упущенной выручки -->
  <g transform="translate(40, 575)">
    <rect x="0" y="0" width="1120" height="240" rx="18" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    
    <text x="25" y="32" font-size="12" font-weight="800" fill="#e11d48">⚠️ РИСК УПУЩЕННОЙ ВЫРУЧКИ</text>
    <text x="25" y="52" font-size="11" font-weight="500" fill="#64748b">Товары продаются, но остаток закончится за &lt;3 дня по текущей скорости продаж.</text>

    <!-- Row 1 Cards -->
    <rect x="25" y="68" width="525" height="65" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <text x="40" y="90" font-size="12" font-weight="700" fill="#0f172a">колье «молитва» круг с бриллиантом (55 см)</text>
    <text x="40" y="112" font-size="10" font-weight="500" fill="#64748b">P2MKB1_55 • остаток <tspan font-weight="700" fill="#e11d48">0</tspan>, скорость <tspan font-weight="700" fill="#e11d48">0.03/день</tspan></text>
    <text x="530" y="100" font-size="14" font-weight="800" fill="#e11d48" text-anchor="end">~0 дн.</text>

    <rect x="570" y="68" width="525" height="65" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <text x="585" y="90" font-size="12" font-weight="700" fill="#0f172a">чокер из аквамарина с бриллиантовой «луной» на замке</text>
    <text x="585" y="112" font-size="10" font-weight="500" fill="#64748b">CH1LBIZAKV2 • остаток <tspan font-weight="700" fill="#e11d48">0</tspan>, скорость <tspan font-weight="700" fill="#e11d48">0.03/день</tspan></text>
    <text x="1075" y="100" font-size="14" font-weight="800" fill="#e11d48" text-anchor="end">~0 дн.</text>

    <!-- Row 2 Cards -->
    <rect x="25" y="145" width="525" height="65" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <text x="40" y="167" font-size="12" font-weight="700" fill="#0f172a">серьги (пара) «мятый лист» из белого / желтого золота</text>
    <text x="40" y="189" font-size="10" font-weight="500" fill="#64748b">S2ML2 • остаток <tspan font-weight="700" fill="#e11d48">0</tspan>, скорость <tspan font-weight="700" fill="#e11d48">0.03/день</tspan></text>
    <text x="530" y="177" font-size="14" font-weight="800" fill="#e11d48" text-anchor="end">~0 дн.</text>

    <rect x="570" y="145" width="525" height="65" rx="12" fill="#fff1f2" stroke="#ffe4e6"/>
    <text x="585" y="167" font-size="12" font-weight="700" fill="#0f172a">браслет из сапфиров с луной из белого золота</text>
    <text x="585" y="189" font-size="10" font-weight="500" fill="#64748b">B2LB1SPFKB • остаток <tspan font-weight="700" fill="#e11d48">0</tspan>, скорость <tspan font-weight="700" fill="#e11d48">0.03/день</tspan></text>
    <text x="1075" y="177" font-size="14" font-weight="800" fill="#e11d48" text-anchor="end">~0 дн.</text>
  </g>
</svg>
