    <text x="20" y="24" font-size="10" font-weight="800" fill="#ec4899" letter-spacing="1.2">СРЕДНИЙ ЧЕК</text>
    <text x="245" y="24" font-size="11" font-weight="800" fill="#e11d48" text-anchor="end">-15.5%</text>
    <text x="20" y="56" font-size="24" font-weight="900" fill="#0f172a">16 533 ₽</text>
    <text x="20" y="74" font-size="11" font-weight="500" fill="#64748b">Прошлый период: 19 565 ₽</text>
    <!-- Dark Sparkline area -->
    <path d="M 20 115 L 50 95 L 90 115 L 130 100 L 170 115 L 210 88 L 245 115 L 245 125 L 20 125 Z" fill="#0f172a"/>
  </g>

  <!-- Card 3: Проданных изделий 98 -->
  <g transform="translate(610, 470)">
    <rect x="0" y="0" width="265" height="130" rx="16" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    <text x="20" y="24" font-size="10" font-weight="800" fill="#ec4899" letter-spacing="1.2">ПРОДАННЫХ ИЗДЕЛИЙ</text>
    <text x="245" y="24" font-size="11" font-weight="800" fill="#059669" text-anchor="end">+1860.0%</text>
    <text x="20" y="56" font-size="28" font-weight="900" fill="#0f172a">98</text>
    <text x="20" y="74" font-size="11" font-weight="500" fill="#64748b">Прошлый период: 5</text>
    <!-- Sparkline -->
    <path d="M 20 115 L 60 90 L 110 118 L 150 75 L 190 115 L 220 100 L 245 115 L 245 125 L 20 125 Z" fill="#0f172a"/>
  </g>

  <!-- Card 4: Сумма возвратов 11 400 ₽ -->
  <g transform="translate(895, 470)">
    <rect x="0" y="0" width="265" height="130" rx="16" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    <text x="20" y="24" font-size="10" font-weight="800" fill="#e11d48" letter-spacing="1.2">СУММА ВОЗВРАТОВ</text>
    <text x="245" y="24" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="end">—</text>
    <text x="20" y="56" font-size="24" font-weight="900" fill="#0f172a">11 400 ₽</text>
    <text x="20" y="74" font-size="11" font-weight="500" fill="#64748b">Прошлый период: 0 ₽</text>
    <!-- Red spike line -->
    <path d="M 20 118 L 210 118 L 240 85 L 245 118 L 245 125 L 20 125 Z" fill="#0f172a"/>
    <line x1="20" y1="118" x2="245" y2="118" stroke="#e11d48" stroke-width="1.5"/>
  </g>

  <!-- Table: История записей из базы -->
  <g transform="translate(40, 615)">
    <rect x="0" y="0" width="1120" height="225" rx="18" fill="#ffffff" stroke="#fbcfe8" filter="url(#shadow-card)" />
    <text x="25" y="30" font-size="10" font-weight="800" fill="#ec4899" letter-spacing="1.2">ИСТОРИЯ</text>
    <text x="25" y="46" font-size="11" font-weight="500" fill="#64748b">Отображаются только фактические записи из базы SQLite.</text>
    <text x="1095" y="35" font-size="11" font-weight="600" fill="#db2777" text-anchor="end">Сортировка: новые сверху</text>

    <!-- Table Header -->
    <line x1="25" y1="60" x2="1095" y2="60" stroke="#fce7f3" />
    <text x="35" y="78" font-size="10" font-weight="800" fill="#ec4899">ДАТА</text>
    <text x="320" y="78" font-size="10" font-weight="800" fill="#ec4899" text-anchor="end">ВЫРУЧКА</text>
    <text x="480" y="78" font-size="10" font-weight="800" fill="#ec4899" text-anchor="end">ЗАКАЗЫ</text>
    <text x="640" y="78" font-size="10" font-weight="800" fill="#ec4899" text-anchor="end">ИЗДЕЛИЯ</text>
    <text x="820" y="78" font-size="10" font-weight="800" fill="#ec4899" text-anchor="end">СРЕДНИЙ ЧЕК</text>
    <text x="1080" y="78" font-size="10" font-weight="800" fill="#ec4899" text-anchor="end">ВОЗВРАТЫ</text>

    <!-- Row 1 -->
    <line x1="25" y1="90" x2="1095" y2="90" stroke="#fff1f2" />
    <text x="35" y="110" font-size="12" font-weight="700" fill="#0f172a">17 сент. 2026 г.</text>
    <text x="320" y="110" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end">4 399 ₽</text>
    <text x="480" y="110" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">3</text>
    <text x="640" y="110" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">1</text>
    <text x="820" y="110" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">1 466 ₽</text>
    <text x="1080" y="110" font-size="12" font-weight="800" fill="#e11d48" text-anchor="end">11 400 ₽</text>

    <!-- Row 2 -->
    <line x1="25" y1="125" x2="1095" y2="125" stroke="#fff1f2" />
    <text x="35" y="145" font-size="12" font-weight="700" fill="#0f172a">16 сент. 2026 г.</text>
    <text x="320" y="145" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end">52 394 ₽</text>
    <text x="480" y="145" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">2</text>
    <text x="640" y="145" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">7</text>
    <text x="820" y="145" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">26 197 ₽</text>
    <text x="1080" y="145" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">0 ₽</text>

    <!-- Row 3 -->
    <line x1="25" y1="160" x2="1095" y2="160" stroke="#fff1f2" />
    <text x="35" y="180" font-size="12" font-weight="700" fill="#0f172a">15 сент. 2026 г.</text>
    <text x="320" y="180" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end">100 008 ₽</text>
    <text x="480" y="180" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">2</text>
    <text x="640" y="180" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">5</text>
    <text x="820" y="180" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">50 004 ₽</text>
    <text x="1080" y="180" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">0 ₽</text>

    <!-- Row 4 -->
    <line x1="25" y1="195" x2="1095" y2="195" stroke="#fff1f2" />
    <text x="35" y="213" font-size="12" font-weight="700" fill="#0f172a">02 сент. 2026 г. (Пик продаж)</text>
    <text x="320" y="213" font-size="13" font-weight="800" fill="#0f172a" text-anchor="end">168 241 ₽</text>
    <text x="480" y="213" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">8</text>
    <text x="640" y="213" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">18</text>
    <text x="820" y="213" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">21 030 ₽</text>
    <text x="1080" y="213" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">0 ₽</text>
  </g>
</svg>
