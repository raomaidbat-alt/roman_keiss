<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRoll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49e78"/>
      <stop offset="100%" stop-color="#b87b56"/>
    </linearGradient>
  </defs>

  <!-- Background Office / Blinds -->
  <rect width="800" height="450" fill="url(#bgGradRoll)"/>
  
  <!-- Venetian Blinds on Left -->
  <g opacity="0.15">
    <line x1="0" y1="40" x2="300" y2="40" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="70" x2="300" y2="70" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="100" x2="300" y2="100" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="130" x2="300" y2="130" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="190" x2="300" y2="190" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="220" x2="300" y2="220" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="250" x2="300" y2="250" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="280" x2="300" y2="280" stroke="#94a3b8" stroke-width="6"/>
    <line x1="0" y1="310" x2="300" y2="310" stroke="#94a3b8" stroke-width="6"/>
  </g>

  <!-- Tony Stark Character Outline & Body -->
  <!-- Suit Body & Folded Arms -->
  <path d="M280 450 L340 280 L400 240 L460 240 L520 280 L580 450 Z" fill="url(#suitGrad)"/>
  <!-- Folded Arms -->
  <path d="M330 330 Q430 360 530 330 L550 450 L310 450 Z" fill="#151922" stroke="#2a3242" stroke-width="2"/>
  <!-- Blue Shirt Collar -->
  <polygon points="400,240 430,290 460,240 440,230 420,230" fill="#1e3a8a"/>
  <!-- Dark Polka Dot Tie -->
  <polygon points="426,270 434,270 438,360 422,360" fill="#0f172a"/>
  <circle cx="430" cy="285" r="1.5" fill="#f87171"/>
  <circle cx="430" cy="305" r="1.5" fill="#f87171"/>
  <circle cx="430" cy="325" r="1.5" fill="#f87171"/>

  <!-- Neck -->
  <rect x="415" y="200" width="30" height="45" fill="url(#skinGrad)" rx="6"/>

  <!-- Head -->
  <ellipse cx="430" cy="155" rx="42" ry="54" fill="url(#skinGrad)"/>

  <!-- Hair (Tony Stark Iconic Messy Hair) -->
  <path d="M385 145 C380 95 480 90 475 145 C485 125 470 80 430 80 C390 80 375 125 385 145 Z" fill="#261a14"/>
  <path d="M390 120 Q430 95 465 115" stroke="#3d2b22" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Beard & Goatee (Tony Stark Iconic Goatee) -->
  <path d="M410 182 Q430 188 450 182 L444 198 Q430 205 416 198 Z" fill="#1f1610"/>
  <!-- Mustache -->
  <path d="M414 175 Q430 178 446 175" stroke="#1f1610" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Mouth with Sarcastic / Skeptical Expression -->
  <path d="M420 185 Q430 182 440 186" stroke="#5c2b18" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M428 152 L430 168 L435 168" stroke="#8c5838" stroke-width="2" fill="none"/>

  <!-- Eyebrows (Raised In Skepticism) -->
  <path d="M400 135 Q415 130 422 136" stroke="#1f1610" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M438 136 Q445 128 460 133" stroke="#1f1610" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- EYES ROLLING UPWARDS (THE MEME CORE) -->
  <ellipse cx="412" cy="144" rx="7" ry="5" fill="#f8fafc"/>
  <circle cx="412" cy="141" r="3" fill="#3b2d24"/>
  <circle cx="413" cy="140" r="1" fill="#ffffff"/>

  <ellipse cx="448" cy="144" rx="7" ry="5" fill="#f8fafc"/>
  <circle cx="448" cy="141" r="3" fill="#3b2d24"/>
  <circle cx="449" cy="140" r="1" fill="#ffffff"/>

  <!-- Meme Caption Overlay Top & Bottom -->
  <rect x="20" y="20" width="760" height="50" rx="10" fill="#0b0e14" fill-opacity="0.85" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="400" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f87171" text-anchor="middle" letter-spacing="1px">
    ❌ КАК ВСЕ РЕАГИРУЮТ НА «ИННОВАЦИОННЫЙ ИИ»:
  </text>
  
  <rect x="20" y="380" width="760" height="52" rx="10" fill="#0b0e14" fill-opacity="0.9" stroke="#334155"/>
  <text x="400" y="412" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    «Опять пустой хайп, шаблонные чат-боты и 0 пользы для ресторанов...»
  </text>
</svg>
