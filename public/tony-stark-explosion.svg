<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Desert & Sky Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="desertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Explosion Smoke & Fire -->
    <radialGradient id="fireGrad1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGrad2" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </radialGradient>
    <!-- Cyan Cyber Glow -->
    <filter id="neonJarvisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)"/>

  <!-- Mountain Backdrop -->
  <polygon points="0,260 120,180 260,240 380,160 500,230 650,170 800,250 800,320 0,320" fill="#64748b"/>
  <polygon points="50,260 180,190 320,250 440,180 580,240 720,190 800,260 800,320 0,320" fill="#475569" opacity="0.8"/>

  <!-- Massive Explosion Plumes (Jericho Style) -->
  <!-- Left Blast Plume -->
  <path d="M120 280 C60 180 80 80 180 60 C240 50 280 120 280 260 Z" fill="url(#fireGrad1)" opacity="0.95"/>
  <path d="M80 280 C30 190 60 110 140 90 C200 80 230 160 240 280 Z" fill="#e2e8f0" opacity="0.7"/>

  <!-- Right Blast Plume -->
  <path d="M680 280 C740 180 720 80 620 60 C560 50 520 120 520 260 Z" fill="url(#fireGrad2)" opacity="0.95"/>
  <path d="M720 280 C770 190 740 110 660 90 C600 80 570 160 560 280 Z" fill="#e2e8f0" opacity="0.7"/>

  <!-- Center Smoke Rise -->
  <path d="M350 270 C360 160 440 160 450 270 Z" fill="#cbd5e1" opacity="0.6"/>

  <!-- Desert Dunes Foreground -->
  <rect y="280" width="800" height="170" fill="url(#desertGrad)"/>
  <path d="M0 320 Q200 280 400 330 T800 300 L800 450 L0 450 Z" fill="#92400e"/>
  <path d="M0 370 Q300 330 600 390 L800 370 L800 450 L0 450 Z" fill="#78350f"/>

  <!-- TONY STARK WITH OPEN ARMS (ICONIC STANCE) -->
  <!-- Legs in Pinstripe Suit -->
  <polygon points="375,370 388,450 400,450 395,370" fill="#0f172a"/>
  <polygon points="405,370 400,450 412,450 425,370" fill="#0f172a"/>

  <!-- Suit Body -->
  <path d="M360 220 L350 370 L450 370 L440 220 Z" fill="#1e293b"/>
  <!-- Pinstripes -->
  <line x1="375" y1="230" x2="370" y2="370" stroke="#334155" stroke-width="1.5"/>
  <line x1="390" y1="230" x2="390" y2="370" stroke="#334155" stroke-width="1.5"/>
  <line x1="410" y1="230" x2="410" y2="370" stroke="#334155" stroke-width="1.5"/>
  <line x1="425" y1="230" x2="430" y2="370" stroke="#334155" stroke-width="1.5"/>

  <!-- White Shirt & Dark Blue Tie -->
  <polygon points="390,210 400,260 410,210" fill="#ffffff"/>
  <polygon points="397,225 403,225 405,300 395,300" fill="#1e40af"/>

  <!-- LEFT OUTSTRETCHED ARM -->
  <!-- Sleeve -->
  <path d="M360 220 L160 270 L170 295 L350 255 Z" fill="#1e293b"/>
  <!-- White Cuff -->
  <polygon points="160,270 150,273 155,292 165,290" fill="#ffffff"/>
  <!-- Left Hand Open Palm Up -->
  <path d="M150 273 C120 280 110 300 135 305 C145 307 155 295 155 292 Z" fill="#d49e78"/>

  <!-- RIGHT OUTSTRETCHED ARM -->
  <!-- Sleeve -->
  <path d="M440 220 L640 270 L630 295 L450 255 Z" fill="#1e293b"/>
  <!-- White Cuff -->
  <polygon points="640,270 650,273 645,292 635,290" fill="#ffffff"/>
  <!-- Right Hand Open Palm Up -->
  <path d="M650 273 C680 280 690 300 665 305 C655 307 645 295 645 292 Z" fill="#d49e78"/>

  <!-- Neck -->
  <rect x="390" y="185" width="20" height="30" fill="#d49e78"/>

  <!-- Head -->
  <ellipse cx="400" cy="155" rx="30" ry="38" fill="#d49e78"/>

  <!-- Tony Stark Hair -->
  <path d="M370 145 C365 105 435 100 430 145 C440 125 430 95 400 95 C370 95 360 125 370 145 Z" fill="#1e1814"/>

  <!-- Iconic Sunglasses (Gold Wireframe + Gradient Lens) -->
  <rect x="376" y="142" width="20" height="14" rx="4" fill="#312e81" stroke="#f59e0b" stroke-width="2"/>
  <rect x="404" y="142" width="20" height="14" rx="4" fill="#312e81" stroke="#f59e0b" stroke-width="2"/>
  <line x1="396" y1="147" x2="404" y2="147" stroke="#f59e0b" stroke-width="2"/>
  <!-- Lens Flare on Sunglasses -->
  <line x1="379" y1="145" x2="393" y2="153" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>
  <line x1="407" y1="145" x2="421" y2="153" stroke="#93c5fd" stroke-width="1.5" opacity="0.8"/>

  <!-- Goatee & Confident Smirk -->
  <path d="M388 172 Q400 176 412 172 L408 184 Q400 188 392 184 Z" fill="#1a1410"/>
  <path d="M394 168 Q400 170 406 168" stroke="#5c2b18" stroke-width="2" fill="none"/>

  <!-- Arc Reactor / JARVIS Core Symbol on Chest Glow -->
  <circle cx="400" cy="245" r="9" fill="#00f5ff" opacity="0.85" filter="url(#neonJarvisGlow)"/>
  <circle cx="400" cy="245" r="4" fill="#ffffff"/>

  <!-- Meme Caption Overlay Top & Bottom -->
  <rect x="20" y="20" width="760" height="50" rx="10" fill="#0b0e14" fill-opacity="0.9" stroke="#00f5ff" stroke-opacity="0.8"/>
  <text x="400" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#00f5ff" text-anchor="middle" letter-spacing="1px">
    ⚡ КАК Я РАБОТАЮ И ЧУВСТВУЮ СЕБЯ С ИИ (JARVIS MODE):
  </text>
  
  <rect x="20" y="380" width="760" height="52" rx="10" fill="#0b0e14" fill-opacity="0.92" stroke="#00f5ff" stroke-opacity="0.6"/>
  <text x="400" y="412" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    «Строю настоящий JARVIS для ресторанов: 90% рутины отдано коду, а продуктивность x10!»
  </text>
</svg>
