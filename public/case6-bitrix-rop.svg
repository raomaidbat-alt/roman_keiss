  <!-- Score 7 Pill -->
  <circle cx="565" cy="266" r="16" fill="#ea580c"/>
  <text x="560" y="272" font-size="15" font-weight="900" fill="#ffffff">7</text>
  <text x="548" y="295" font-size="9" font-weight="700" fill="#c2410c">из 10 баллов</text>

  <!-- Call Summary -->
  <text x="635" y="268" font-size="12.5" font-weight="700" fill="#0f172a">
