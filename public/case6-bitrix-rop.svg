  <line x1="35" y1="235" x2="1165" y2="235" stroke="#e2e8f0"/>
  <rect x="35" y="238" width="1130" height="320" rx="8" fill="#f0fdf4" fill-opacity="0.45" stroke="#bbf7d0" stroke-width="1.5"/>

  <text x="50" y="270" font-size="12" font-weight="700" fill="#0f172a">26.08.2026 17:52</text>

  <rect x="175" y="255" width="80" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="187" y="270" font-size="11" font-weight="700" fill="#1d4ed8">Исходящий</text>

  <rect x="275" y="255" width="145" height="22" rx="4" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="283" y="270" font-size="11" font-weight="700" fill="#4338ca">Продажа (мы продаём)</text>

  <rect x="440" y="255" width="65" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/>
