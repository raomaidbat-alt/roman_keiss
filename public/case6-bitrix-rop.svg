<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container Window -->
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header Bar -->
  <path d="M 20 36 Q 20 20 36 20 L 1164 20 Q 1180 20 1180 36 L 1180 72 L 20 72 Z" fill="#f1f5f9"/>
  <circle cx="48" cy="46" r="6" fill="#ef4444"/>
  <circle cx="68" cy="46" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="46" r="6" fill="#10b981"/>

  <text x="115" y="51" font-size="13" font-weight="700" fill="#475569">Журнал звонков и ИИ-контроль качества (Битрикс24 + Yandex SpeechKit)</text>

  <rect x="990" y="34" width="165" height="24" rx="12" fill="#e0f2fe"/>
  <text x="1005" y="50" font-size="11" font-weight="700" fill="#0284c7">● Интеграция активна</text>

  <!-- Table Header -->
  <rect x="35" y="85" width="1130" height="34" rx="6" fill="#f8fafc" stroke="#edf2f7"/>
  <text x="50" y="107" font-size="11" font-weight="700" fill="#64748b">ДАТА И ВРЕМЯ</text>
  <text x="175" y="107" font-size="11" font-weight="700" fill="#64748b">ТИП ЗВОНКА</text>
  <text x="275" y="107" font-size="11" font-weight="700" fill="#64748b">СТАТУС / ТЕМА</text>
  <text x="440" y="107" font-size="11" font-weight="700" fill="#64748b">СОБЕСЕДНИК</text>
  <text x="540" y="107" font-size="11" font-weight="700" fill="#64748b">ОЦЕНКА ИИ</text>
  <text x="635" y="107" font-size="11" font-weight="700" fill="#64748b">АНАЛИЗ ДИАЛОГА, ТРАНСКРИПТ И РЕКОМЕНДАЦИИ РОПУ</text>

  <!-- Row 1: Robot IVR (Auto-responder) -->
  <line x1="35" y1="128" x2="1165" y2="128" stroke="#f1f5f9"/>
  <text x="50" y="152" font-size="12" font-weight="600" fill="#334155">26.08.2026 18:00</text>
  
  <rect x="175" y="138" width="80" height="22" rx="4" fill="#eff6ff"/>
  <text x="187" y="153" font-size="11" font-weight="600" fill="#2563eb">Исходящий</text>

  <rect x="275" y="138" width="95" height="22" rx="4" fill="#f1f5f9"/>
  <text x="284" y="153" font-size="11" font-weight="500" fill="#64748b">Не определено</text>

  <rect x="440" y="138" width="75" height="22" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="450" y="153" font-size="11" font-weight="500" fill="#64748b">Робот/IVR</text>

  <text x="560" y="153" font-size="13" font-weight="700" fill="#94a3b8">—</text>

  <text x="635" y="152" font-size="12" font-weight="700" fill="#475569">автоответчик</text>
  <text x="635" y="170" font-size="11" font-weight="500" fill="#3b82f6">▼ Показать транскрипт</text>
  <text x="765" y="170" font-size="11" fill="#94a3b8">[00:00] Канал 0: К сожалению, мы не можем ответить на ваш звонок, пожалуйста...</text>

  <!-- Row 2: Unanswered -->
  <line x1="35" y1="188" x2="1165" y2="188" stroke="#f1f5f9"/>
  <text x="50" y="212" font-size="12" font-weight="600" fill="#334155">26.08.2026 17:59</text>

  <rect x="175" y="198" width="80" height="22" rx="4" fill="#eff6ff"/>
  <text x="187" y="213" font-size="11" font-weight="600" fill="#2563eb">Исходящий</text>

  <rect x="275" y="198" width="75" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
