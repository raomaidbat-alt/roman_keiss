  </text>
  <text x="635" y="286" font-size="12" fill="#334155">
    для обсуждения сотрудничества. Скрипт соблюдён частично, выявлен интерес к поставкам оборудования.
  </text>

  <!-- AI Recommendations Box (Lightbulb) -->
  <rect x="635" y="300" width="510" height="68" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.2"/>
  <text x="648" y="320" font-size="12" font-weight="700" fill="#854d0e">💡 Рекомендации ИИ для повышения конверсии менеджера:</text>
  <text x="648" y="338" font-size="11" fill="#713f12">• Более детально выяснять потребности клиента, задавать уточняющие вопросы;</text>
  <text x="648" y="354" font-size="11" fill="#713f12">• Предложить варианты встречи с учетом часовых поясов; Зафиксировать дедлайн.</text>

  <!-- Expand Transcript Box -->
  <rect x="635" y="380" width="510" height="162" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M 635 380 L 1145 380 L 1145 406 L 635 406 Z" fill="#f8fafc"/>
  <text x="648" y="398" font-size="11" font-weight="700" fill="#2563eb">▼ Транскрипт диалога (Yandex SpeechKit ASR):</text>

  <text x="648" y="424" font-size="11" font-weight="600" fill="#0f172a">[00:00] Менеджер (Канал 1):</text>
  <text x="795" y="424" font-size="11" fill="#334155">Отдел, добрый день!</text>

  <text x="648" y="442" font-size="11" font-weight="600" fill="#64748b">[00:01] Клиент (Канал 0):</text>
  <text x="795" y="442" font-size="11" fill="#334155">Здравствуйте.</text>

  <text x="648" y="460" font-size="11" font-weight="600" fill="#0f172a">[00:04] Менеджер (Канал 1):</text>
  <text x="795" y="460" font-size="11" fill="#334155">Это Данил, компания по России. Получили вашу заявку, хотели уточнить детали.</text>

  <text x="648" y="478" font-size="11" font-weight="600" fill="#64748b">[00:10] Клиент (Канал 0):</text>
  <text x="795" y="478" font-size="11" fill="#334155">Угу.</text>

  <text x="648" y="496" font-size="11" font-weight="600" fill="#0f172a">[00:13] Менеджер (Канал 1):</text>
  <text x="795" y="496" font-size="11" fill="#334155">Есть у вас время? Подскажите сферу и объём поставок оборудования...</text>

  <text x="648" y="514" font-size="11" font-weight="600" fill="#64748b">[00:26] Клиент (Канал 0):</text>
  <text x="795" y="514" font-size="11" fill="#334155">Поставьте это оборудование. Продажа и доставка по нашему филиалу.</text>

  <text x="648" y="532" font-size="10" font-style="italic" fill="#94a3b8">... развернуть полный стенографический отчет звонка (длительность 02:44)</text>

  <!-- Row 4: Incoming Call -->
  <line x1="35" y1="575" x2="1165" y2="575" stroke="#f1f5f9"/>
  <text x="50" y="605" font-size="12" font-weight="600" fill="#334155">26.08.2026 16:55</text>

  <rect x="175" y="591" width="80" height="22" rx="4" fill="#ecfdf5"/>
  <text x="189" y="606" font-size="11" font-weight="600" fill="#059669">Входящий</text>

  <rect x="275" y="591" width="75" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="283" y="606" font-size="11" font-weight="500" fill="#94a3b8">Без ответа</text>

  <rect x="440" y="591" width="75" height="22" rx="4" fill="#f8fafc"/>
  <text x="445" y="606" font-size="11" font-weight="500" fill="#94a3b8">Не определено</text>

  <text x="560" y="606" font-size="13" font-weight="700" fill="#94a3b8">—</text>
  <text x="635" y="605" font-size="12" fill="#64748b">Нет записи разговора — вероятно, звонок остался без ответа.</text>

  <!-- Footer Info Bar -->
  <rect x="35" y="630" width="1130" height="22" fill="#ffffff"/>
  <text x="50" y="642" font-size="11" fill="#94a3b8">Синхронизация с карточкой сделки CRM Битрикс24 выполнена автоматически за 4.2 сек.</text>
